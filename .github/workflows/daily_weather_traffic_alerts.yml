name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    # Morning commute updates
    - cron: "0 9 * * *"    # 5:00 AM Eastern
    - cron: "0 10 * * *"   # 6:00 AM Eastern
    - cron: "0 11 * * *"   # 7:00 AM Eastern
    - cron: "0 12 * * *"   # 8:00 AM Eastern
    - cron: "0 13 * * *"   # 9:00 AM Eastern

    # Noon update
    - cron: "0 16 * * *"   # 12:00 PM Eastern

    # Afternoon rush hour
    - cron: "0 20 * * *"   # 4:00 PM Eastern
    - cron: "0 21 * * *"   # 5:00 PM Eastern
    - cron: "0 22 * * *"   # 6:00 PM Eastern
    - cron: "0 23 * * *"   # 7:00 PM Eastern

  workflow_dispatch:

jobs:
  daily-broadcast:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests gtts

      - name: Generate live traffic report
        run: |
          python3 traffic_broadcast.py

      - name: Generate weather broadcast
        run: |
          python3 morning_broadcast.py

      - name: Upload broadcast to RadioJar
        run: |
          python3 radiojar_upload.py
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
