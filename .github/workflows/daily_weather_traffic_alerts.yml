name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    - cron: "0 9 * * *"
    - cron: "0 12 * * *"
    - cron: "0 16 * * *"
    - cron: "0 20 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

jobs:
  daily-broadcast:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests gtts

      - name: Generate Weather Traffic Broadcast
        run: |
          python3 audio_generator.py

      - name: Upload Broadcast To RadioJar
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
        run: |
          python3 radiojar_upload.py

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          pip install requests gtts

      - name: Check Emergency Alerts
        run: python3 emergency_alerts.py

      - name: Generate Weather Traffic Broadcast
        run: |
          python3 audio_generator.py

      - name: Upload Broadcast To RadioJar
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
        run: |
          python3 radiojar_upload.py
