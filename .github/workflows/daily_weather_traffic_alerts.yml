name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    - cron: "0 5 * * *"
      timezone: "America/New_York"

    - cron: "0 8 * * *"
      timezone: "America/New_York"

    - cron: "0 12 * * *"
      timezone: "America/New_York"

    - cron: "0 16 * * *"
      timezone: "America/New_York"

    - cron: "0 19 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  daily-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests gtts

      - name: Check Emergency Alerts
        run: |
          python3 emergency_alerts.py

      - name: Generate Weather Traffic Broadcast
        run: |
          python3 audio_generator.py

      - name: Prepare Broadcast Files
        run: |
          mkdir -p broadcast_files

          if [ -f emergency_alert.mp3 ]; then
            cp emergency_alert.mp3 broadcast_files/
          fi

          if [ -f delaware_all_saints_update.mp3 ]; then
            cp delaware_all_saints_update.mp3 broadcast_files/
          fi

          echo "Broadcast files:"
          ls -lh broadcast_files/

      - name: Send Broadcast Files To Oracle Server
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$ORACLE_SSH_KEY" > ~/.ssh/radio_server_key
          chmod 600 ~/.ssh/radio_server_key

          ssh-keyscan -H "$ORACLE_HOST" >> ~/.ssh/known_hosts

          ssh \
            -i ~/.ssh/radio_server_key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "mkdir -p ~/radio-broadcast/incoming"

          scp \
            -i ~/.ssh/radio_server_key \
            broadcast_files/*.mp3 \
            "$ORACLE_USER@$ORACLE_HOST:~/radio-broadcast/incoming/"

          ssh \
            -i ~/.ssh/radio_server_key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "ls -lh ~/radio-broadcast/incoming/"

      - name: Tell Oracle Server To Process Broadcast
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -e

          printf '%s\n' "$ORACLE_SSH_KEY" > /tmp/radio_server_key
          chmod 600 /tmp/radio_server_key

          ssh \
            -i /tmp/radio_server_key \
            "$ORACLE_USER@$ORACLE_HOST" \
            "if [ -x ~/radio-broadcast/process_broadcast.sh ]; then
               ~/radio-broadcast/process_broadcast.sh
             else
               echo 'ERROR: process_broadcast.sh is not installed on Oracle server.'
               exit 1
             fi"
