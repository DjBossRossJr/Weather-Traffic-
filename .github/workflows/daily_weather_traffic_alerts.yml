name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    # 5:00 AM Eastern
    - cron: "0 5 * * *"
      timezone: "America/New_York"

    # 8:00 AM Eastern
    - cron: "0 8 * * *"
      timezone: "America/New_York"

    # 12:00 PM Eastern
    - cron: "0 12 * * *"
      timezone: "America/New_York"

    # 4:00 PM Eastern
    - cron: "0 16 * * *"
      timezone: "America/New_York"

    # 7:00 PM Eastern
    - cron: "0 19 * * *"
      timezone: "America/New_York"

  workflow_dispatch:

jobs:
  daily-broadcast:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          python -m pip install requests gtts

      - name: Check Emergency Alerts
        run: |
          python3 emergency_alerts.py

      - name: Upload Emergency Alert
        if: hashFiles('emergency_alert.mp3') != ''
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
        run: |
          python3 radiojar_upload.py emergency_alert.mp3

      - name: Generate Weather Traffic Broadcast
        run: |
          python3 audio_generator.py

      - name: Upload Weather Traffic Broadcast
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
        run: |
          python3 radiojar_upload.py delaware_all_saints_update.mp3
