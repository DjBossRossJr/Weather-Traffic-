name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    # Morning commute updates (5 AM - 9 AM Eastern)
    - cron: "0 9 * * *"     # 5:00 AM ET
    - cron: "0 10 * * *"    # 6:00 AM ET
    - cron: "0 11 * * *"    # 7:00 AM ET
    - cron: "0 12 * * *"    # 8:00 AM ET
    - cron: "0 13 * * *"    # 9:00 AM ET

    # Noon traffic update
    - cron: "0 16 * * *"    # 12:00 PM ET

    # Evening rush hour (4 PM - 7 PM Eastern)
    - cron: "0 20 * * *"    # 4:00 PM ET
    - cron: "0 21 * * *"    # 5:00 PM ET
    - cron: "0 22 * * *"    # 6:00 PM ET
    - cron: "0 23 * * *"    # 7:00 PM ET

  workflow_dispatch:

jobs:
  daily-broadcast:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests gtts

      - name: Generate live traffic update
        run: |
          python3 traffic_broadcast.py

      - name: Generate weather broadcast
        run: |
          python3 morning_broadcast.py

      - name: Create broadcast audio
  run: |
    python3 audio_generator.py

- name: Start RadioJar Live Stream
  run: |
    python3 live_stream.py
  env:
    STREAM_HOST: ${{ secrets.STREAM_HOST }}
    STREAM_PORT: ${{ secrets.STREAM_PORT }}
    STREAM_USERNAME: ${{ secrets.STREAM_USERNAME }}
    STREAM_PASSWORD: ${{ secrets.STREAM_PASSWORD }}
    STREAM_MOUNTPOINT: ${{ secrets.STREAM_MOUNTPOINT }}

- name: Save broadcast file
  uses: actions/upload-artifact@v4
  with:
    name: delaware-all-saints-broadcast
    path: output.mp3
