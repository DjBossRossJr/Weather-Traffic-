name: Delaware All Saints Daily Weather, Traffic & Alerts

on:
  schedule:
    - cron: "0 4 * * *"     # 12 AM Eastern
    - cron: "0 10 * * *"    # 6 AM Eastern
    - cron: "0 11 * * *"    # 7 AM Eastern
    - cron: "0 14 * * *"    # 10 AM Eastern
    - cron: "0 16 * * *"    # 12 PM Eastern
    - cron: "0 20 * * *"    # 4 PM Eastern
    - cron: "0 21 * * *"    # 5 PM Eastern
    - cron: "0 2 * * *"     # 10 PM Eastern (next day UTC)
    - cron: "0 3 * * *"     # 11 PM Eastern (next day UTC)

  workflow_dispatch:

jobs:
  daily-broadcast:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests gtts

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run broadcast
        run: |
          python3 traffic_broadcast.py
                 
      - name: Stream to RadioJar
        run: |
          ffmpeg -re -i output.mp3 -acodec libmp3lame -b:a 128k \
          -f mp3 "icecast://source:${{ secrets.STREAM_PASSWORD }}@${{ secrets.STREAM_HOST }}:${{ secrets.STREAM_PORT }}/${{ secrets.STREAM_MOUNTPOINT }}"

