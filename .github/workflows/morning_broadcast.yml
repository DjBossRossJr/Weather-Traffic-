name: Delaware All Saints Global Morning Broadcast

on:
  schedule:
    # Runs every day at 5:00 AM Eastern Time
    - cron: "0 10 * * *"

  workflow_dispatch:

jobs:
  morning-broadcast:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests gtts

      - name: Generate Gospel Morning Broadcast
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          python morning_broadcast.py

      - name: Upload MP3 to RadioJar
        env:
          RADIOJAR_API_KEY: ${{ secrets.RADIOJAR_API_KEY }}
        run: |
          python radiojar_upload.py
